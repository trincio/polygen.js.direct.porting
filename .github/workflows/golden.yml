name: Generate OCaml golden outputs

on:
  workflow_dispatch:   # solo manuale
  push:
    paths:
      - '.github/workflows/golden.yml'
      - 'tests/grammars/**'
      - 'tests/cases.json'

permissions:
  contents: write

jobs:
  golden:
    # Fissato di proposito: OCaml 4.11.2 (richiesto dai sorgenti Polygen) non si
    # compila con il GCC 15 / C23 di ubuntu-latest (ora ubuntu-26.04).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout alvisespano/Polygen
        uses: actions/checkout@v4
        with:
          repository: alvisespano/Polygen
          path: polygen-src

      - name: Set up OCaml 4.11
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.11.x
          opam-disable-sandboxing: true

      - name: Install dependencies
        run: opam install dune menhir --yes

      - name: Build polygen binary (solo target nativo, senza js_of_ocaml)
        run: |
          eval $(opam env)
          cd polygen-src
          dune build src/polygen.exe
          echo "$(pwd)/_build/default/src/polygen.exe" >> $GITHUB_PATH

      - name: Run grammars and collect golden outputs
        run: |
          eval $(opam env)
          POLYGEN=$(pwd)/polygen-src/_build/default/src/polygen.exe

          node - <<'JSEOF'
          const { execFileSync } = require('child_process');
          const fs   = require('fs');
          const path = require('path');

          const POLYGEN = process.env.POLYGEN_BIN;
          const grmsDir = 'tests/grammars';
          const cases   = JSON.parse(fs.readFileSync('tests/cases.json', 'utf8'));
          const golden  = {};

          // Il binario OCaml emette byte grezzi: se una grammatica contiene un
          // escape come \232, esce il singolo byte 0xE8 (Latin-1), che NON e'
          // UTF-8 valido. Decodificare tutto come UTF-8 lo trasformava in "�"
          // dentro golden.json. Qui si tiene come UTF-8 ogni sequenza valida
          // (es. "è" scritta direttamente nel sorgente della grammatica) e si
          // interpreta come Latin-1 ogni byte isolato che non lo e'.
          const utf8 = new TextDecoder('utf-8', { fatal: true });
          function decodeBytes(buf) {
            let out = '';
            let i = 0;
            while (i < buf.length) {
              const b = buf[i];
              if (b < 0x80) { out += String.fromCharCode(b); i++; continue; }
              const n = (b >= 0xF0 && b <= 0xF4) ? 4
                      : (b >= 0xE0 && b <= 0xEF) ? 3
                      : (b >= 0xC2 && b <= 0xDF) ? 2 : 0;
              if (n && i + n <= buf.length) {
                try { out += utf8.decode(buf.subarray(i, i + n)); i += n; continue; }
                catch (e) { /* byte non UTF-8: cade sotto come Latin-1 */ }
              }
              out += String.fromCharCode(b);   // Latin-1: byte -> stesso code point
              i++;
            }
            return out;
          }

          for (const tc of cases) {
            const grmPath = path.join(grmsDir, tc.grammar + '.grm');
            const args = ['-seed', String(tc.seed)];
            if (tc.start && tc.start !== 'S') args.push('-S', tc.start);
            if (tc.labels) tc.labels.forEach(l => args.push('-l', l));
            if (tc.times)  args.push('-X', String(tc.times));
            args.push(grmPath);
            try {
              const out = decodeBytes(execFileSync(POLYGEN, args)).trimEnd();
              golden[tc.id] = out;
            } catch (e) {
              golden[tc.id] = 'ERROR:' + e.message;
            }
          }

          fs.writeFileSync('tests/golden.json', JSON.stringify(golden, null, 2) + '\n');
          console.log('Written tests/golden.json with ' + Object.keys(golden).length + ' entries.');
          JSEOF
        env:
          POLYGEN_BIN: ${{ github.workspace }}/polygen-src/_build/default/src/polygen.exe

      - name: Commit golden outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/golden.json
          git diff --cached --quiet || git commit -m "chore: update OCaml golden outputs"
          git push
